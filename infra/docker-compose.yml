services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: llmc
      POSTGRES_PASSWORD: llmc
      POSTGRES_DB: llmc
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmc"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/llmcdevpass
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4jdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Mocked payment gateway — no real Stripe charges ever happen.
  stripe-mock:
    image: stripe/stripe-mock:latest
    ports: ["12111:12111"]

volumes:
  pgdata:
  neo4jdata:
